name: EarnUp
description: >-
  EarnUp is a San Francisco-based financial-wellness fintech that automates
  consumer debt paydown and savings. Using patented technology and predictive
  analytics, its platform lets people schedule and automatically make payments
  toward mortgages, auto loans, student loans, and other personal debt, and
  save for life events. EarnUp sells engagement and AI-advisor tooling to
  lenders, mortgage servicers, credit unions, employers, unions, and financial
  professionals, and reports that more than three million people have used the
  platform. Surfaced as a portfolio company of Bain Capital Ventures, this is a
  company profile in the API Evangelist network; EarnUp publishes no public
  developer API, so enrichment is limited to identity and security posture.
